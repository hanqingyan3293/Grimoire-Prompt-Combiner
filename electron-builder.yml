appId: com.grimoire.prompt-combiner
productName: Grimoire
copyright: GPL-3.0 License
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - data/**/*
extraResources:
  - from: python
    to: python
    filter:
      - wd14_worker.py
      - wd14_tagger.py
      - requirements.txt
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/icons/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Grimoire
extraMetadata:
  main: dist/main/main/index.js
